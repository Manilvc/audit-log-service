# Audit Log Service mounted on a SHARED domain under a sub-path.
#
# Use this instead of audit.conf when the service shares
# api-evrc.viitorcloud.in with the main backend rather than getting its own
# subdomain.
#
# External path map (nginx strips /audit, uvicorn runs with --root-path /audit):
#   https://api-evrc.viitorcloud.in/audit/v1/audit/events        -> POST ingest
#   https://api-evrc.viitorcloud.in/audit/v1/audit/events/export -> NDJSON export
#   https://api-evrc.viitorcloud.in/audit/v1/audit/compliance/*  -> compliance ops
#   https://api-evrc.viitorcloud.in/audit/v1/audit/admin/*       -> admin ops
#   https://api-evrc.viitorcloud.in/audit/health/live|ready      -> probes
#   https://api-evrc.viitorcloud.in/audit/metrics                -> 404 (blocked)
#   https://api-evrc.viitorcloud.in/audit/docs                   -> Swagger console
#   https://api-evrc.viitorcloud.in/audit/redoc                  -> API reference
#   https://api-evrc.viitorcloud.in/audit/static/*               -> vendored UI assets
#
# The two documentation pages load their bundles from /audit/static, never from
# a CDN, so they work on a host with no outbound internet. Two things they do
# need from this config, both satisfied by the single /audit/ location below:
#
#   * The prefix must reach the app as `--root-path /audit`, or the pages build
#     asset URLs against the domain root - which the main backend owns.
#   * No server-level `add_header Content-Security-Policy` may cover /audit/.
#     A browser given two CSP headers enforces both, and the intersection of a
#     `default-src 'none'` API policy with the app's docs policy is "load
#     nothing": the page returns 200 and renders blank. The app already sends
#     the right policy for each route.
#
# The /v1/audit/... doubling is not a typo: /audit is the external mount point
# and /v1/audit is the app's own route prefix.

# ---------------------------------------------------------------------------
# 1. Put this upstream at the TOP of api-evrc.viitorcloud.in.conf, OUTSIDE any
#    server { } block (upstream is only valid in the http context).
# ---------------------------------------------------------------------------
upstream audit_api {
    server 127.0.0.1:8020;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# 2. Paste the blocks below INSIDE the existing `listen 443 ssl` server block
#    for api-evrc.viitorcloud.in. Do not create a second server block.
# ---------------------------------------------------------------------------

# Prometheus scrape endpoint is unauthenticated — never expose it publicly.
# Exact match beats the /audit/ prefix match below, so this wins.
location = /audit/metrics {
    return 404;
}

# Bare /audit has no trailing slash and would not match `location /audit/`.
location = /audit {
    return 301 /audit/;
}

location /audit/ {
    # Trailing slash on proxy_pass strips the /audit prefix:
    #   /audit/v1/audit/events  ->  /v1/audit/events
    # This MUST stay in sync with --root-path /audit in audit-log-api.service.
    proxy_pass http://audit_api/;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /audit;

    # Ingest batches cap at 500 events; 2m leaves headroom for labels.
    # Overrides the server-level value for this location only.
    client_max_body_size 2m;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    # Long enough for the streaming NDJSON export to finish.
    proxy_read_timeout    600s;

    # Off so export chunks reach the client as they are produced.
    proxy_buffering off;
}
