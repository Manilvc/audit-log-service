# Nginx front for the EveryCRED Audit Log Service.
# Upstream: FastAPI on 127.0.0.1:8020 (override via upstream block).
#
# Hard rule: /metrics must never be reachable from the public internet.
# The scrape endpoint is unauthenticated and is intended for in-cluster
# Prometheus only (see app/api/v1/ops.py).

upstream audit_api {
    server 127.0.0.1:8020;
    keepalive 32;
}

# Internal scrape listener — bind only on loopback / private iface in prod.
# Prometheus scrapes here; the public server block below returns 404 for /metrics.
server {
    listen 127.0.0.1:9102;
    server_name _;

    location /metrics {
        proxy_pass http://audit_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name audit.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name audit.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/audit.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audit.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Ingest batches are capped at 500 events; 2m leaves headroom for labels.
    client_max_body_size 2m;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # ---- deny external scrape of process metrics ----
    location = /metrics {
        return 404;
    }

    location /health {
        access_log off;
        proxy_pass http://audit_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location /health/ {
        access_log off;
        proxy_pass http://audit_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Streaming NDJSON export — disable buffering so clients get chunks promptly.
    location = /v1/audit/events/export {
        proxy_pass http://audit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /v1/ {
        proxy_pass http://audit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        # Export and large search responses benefit from streaming.
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
