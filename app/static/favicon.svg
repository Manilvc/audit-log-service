<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="EveryCRED">
  <!-- Vendored favicon for the documentation pages. Local so the CSP for those
       routes needs no external origin: FastAPI's stock page points at
       fastapi.tiangolo.com, which a locked-down network cannot reach. -->
  <defs>
    <linearGradient id="ec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0054e9"/>
      <stop offset="1" stop-color="#1e4383"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#ec)"/>
  <text x="16" y="21.5" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
        font-size="14" font-weight="700" letter-spacing="-0.5" fill="#ffffff">EC</text>
</svg>
