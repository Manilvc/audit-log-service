# ---------------------------------------------------------------------------
# EveryCRED Audit Log Service
#
# Dependency + tooling manifest. Managed with `uv` (NOT poetry).
#   uv sync --all-extras        install everything incl. dev tooling
#   uv run audit-service serve  run the API
#   uv run pytest               run the test suite
#
# Build backend is hatchling: PEP 517/621 native, no poetry-core involvement.
# ---------------------------------------------------------------------------
[project]
name = "everycred-audit-service"
version = "1.0.0"
description = "Tamper-evident, multi-tenant audit log microservice for the EveryCRED DCS platform"
readme = "README.md"
# Floor is 3.13 so the service can also run on the platform's current
# interpreter; .python-version pins local/CI development to 3.14.
requires-python = ">=3.13,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "EveryCRED Platform Team" }]

dependencies = [
    # --- Web framework -----------------------------------------------------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",

    # --- Elasticsearch -----------------------------------------------------
    # Pinned to the 8.x line to match the deployed cluster (8.19.20). The
    # client sends an `Accept: ...compatible-with=<major>` header and an 8.x
    # node rejects major 9 outright ("Accept version must be either version 8
    # or 7"). An 8.x client is still accepted by a 9.x node, so this is the
    # safe side to sit on until the server is upgraded; bump both together.
    "elasticsearch[async]>=8.19,<9",

    # --- Durable ingest buffer (Redis Streams) -----------------------------
    # >=5 for XAUTOCLAIM support, which the stale-entry recovery path needs.
    "redis[hiredis]>=5",

    # --- WORM archive (S3 Object Lock) -------------------------------------
    "aioboto3>=13",

    # --- Security / crypto -------------------------------------------------
    "pyjwt>=2.9",
    "cryptography>=43",

    # --- Observability -----------------------------------------------------
    "structlog>=24.4",
    "prometheus-client>=0.21",

    # --- Misc --------------------------------------------------------------
    "click>=8.1",
    "orjson>=3.10",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    # The [lua] extra pulls in lupa, without which fakeredis cannot execute
    # EVAL. The chain allocator's atomicity lives in Lua scripts, so testing
    # it without Lua support would leave the sequencing guarantee unverified.
    "fakeredis[lua]>=2.25",

    # Compliance / quality gates
    "ruff>=0.7",
    "mypy>=1.11",
    "bandit[toml]>=1.7",   # SAST
    "pip-audit>=2.7",      # CVE scan of the locked dependency tree
]

[project.scripts]
audit-service = "app.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Lint / format — ruff replaces black + isort + flake8 + pyupgrade
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # flake8-bugbear
    "C4",         # comprehensions
    "UP",         # pyupgrade
    "ASYNC",      # async correctness (blocking calls in async defs)
    "S",          # flake8-bandit
    "T20",        # no print()
    "SIM",        # simplify
    "RUF",
]
ignore = [
    "S101",  # assert — allowed, used for invariants and in tests
    "B008",  # function call in default arg — the FastAPI Depends() idiom
]

[tool.ruff.lint.isort]
# Without this, `app` lands in the third-party block inside tests/.
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # hardcoded test secrets are fine
# The audit taxonomy necessarily contains action names like
# "user.password_reset". flake8-bandit reads any assignment whose name
# contains PASSWORD as a hardcoded credential; here they are event
# identifiers, and suppressing per-line would need a noqa on every one.
"app/domain/enums.py" = ["S105"]
# Developer utilities run from a terminal, so stdout *is* the interface. T201
# is the right rule for `app/`, where a stray print bypasses structured logging.
"scripts/**" = ["T201"]

# ---------------------------------------------------------------------------
# Typing — strict, because a mistyped tenant filter is a data-leak bug
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*", "fakeredis.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# SAST
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Fixtures and tests must share one event loop. The integration suite builds a
# module-scoped Elasticsearch client, and with the default (function) loop scope
# pytest-asyncio would run the fixture on a loop that is closed before the test
# body executes - surfacing as aiohttp's "Timeout context manager should be used
# inside a task".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires live Elasticsearch/Redis/S3 (docker compose up)",
]
