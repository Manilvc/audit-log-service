# Local development stack for the audit log service.
#
# NOT a production manifest. The differences are called out per service; the
# most important are that Elasticsearch security is off, and MinIO stands in for
# S3. Both are noted where they appear.

name: everycred-audit

services:
  # ---------------------------------------------------------------------------
  # Elasticsearch 9.x - single node
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: audit-es
    environment:
      - node.name=audit-es
      - discovery.type=single-node
      # Security is DISABLED for local development only. In production this
      # must be `true` with TLS and a scoped API key - the service refuses to
      # start with an http:// host when ENVIRONMENT=prod.
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      # No xpack.ilm.enabled here: the setting was removed in Elasticsearch 9.x,
      # where ILM is always on. Passing it makes the node refuse to boot with
      # "unknown setting [xpack.ilm.enabled]".
      # 1 GB heap is enough for development. Production sizing: 50% of
      # container memory, never above ~31 GB (above that the JVM loses
      # compressed object pointers and effective heap goes *down*).
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
      - cluster.routing.allocation.disk.threshold_enabled=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      # `status=yellow` is correct for a single node: replicas cannot be
      # allocated with one node, so green is unreachable and waiting for it
      # would hang forever.
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Redis - the durable ingest buffer
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: audit-redis
    # appendonly is NOT optional. Without AOF, Redis is an in-memory buffer and
    # a restart loses every un-drained audit event - which breaks the
    # no-lost-events guarantee the whole design rests on.
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
      --save ""
    # noeviction matters as much as AOF: under memory pressure Redis must
    # reject writes rather than silently evict queued audit events.
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # MinIO - S3-compatible WORM archive for local development
  # ---------------------------------------------------------------------------
  # Stands in for S3. MinIO implements Object Lock, so the immutability path is
  # genuinely exercised locally rather than stubbed. Production uses real S3
  # with COMPLIANCE-mode Object Lock, which cannot be overridden even by the
  # account root - MinIO's guarantee is weaker than that.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: audit-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      # Development-only credential. Never used outside this compose file.
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # The service itself
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      target: runtime
    container_name: audit-api
    command: ["serve"]
    env_file: [.env]
    environment:
      # Container DNS names override whatever .env has for localhost.
      - ES_HOSTS=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    ports:
      - "8020:8020"
    depends_on:
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8020/health/live', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      target: runtime
    container_name: audit-worker
    command: ["worker"]
    env_file: [.env]
    environment:
      - ES_HOSTS=http://elasticsearch:9200
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    # More than one replica is safe and is the normal production shape: each
    # takes a Redis lease per partition, so exactly one writer owns a partition
    # at a time and hash chaining stays correctly ordered.
    deploy:
      replicas: 1

volumes:
  es-data:
  redis-data:
  minio-data:
